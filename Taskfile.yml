# https://taskfile.dev
# Monorepo orchestration for sales-order-netsuite
# Each sub-project maintains its own Taskfile.yml.
# This root file aggregates them via `includes` for unified dev/build/test.

version: '3'

dotenv:
  - ./sales-order-backend/.env
silent: true

includes:
  frontend:
    taskfile: ./sales-order-frontend/Taskfile.yml
    dir: ./sales-order-frontend
  backend:
    taskfile: ./sales-order-backend/Taskfile.yml
    dir: ./sales-order-backend
  app:
    taskfile: ./sales-order-app/Taskfile.yml
    dir: ./sales-order-app

tasks:
  default:
    desc: Lists available commands
    cmds:
      - task -l

  dev:
    desc: 啟動後端開發伺服器（背景） + 前端 dev server
    cmds:
      - task: backend:dev &
      - sleep 3
      - task: frontend:dev

  build:
    desc: 建置所有子專案（frontend → backend → app）
    cmds:
      - task: frontend:build
      - task: backend:build
      - task: app:build

  test:
    desc: 執行所有子專案的測試
    cmds:
      - task: frontend:test
      - task: backend:test
      - task: app:test

  tests:auth:
    desc: 執行 session-auth-improvements 相關測試（CSRF, API Key, Sliding Session, Integration）
    cmds:
      - task: backend:test:auth

  # App Store / Play Store release orchestration
  fastlane:beta:ios:
    desc: 上傳 iOS Beta build 到 TestFlight
    cmds:
      - cd sales-order-app/ios && bundle exec fastlane ios beta

  fastlane:beta:android:
    desc: 上傳 Android Beta build 到 Play Store
    cmds:
      - cd sales-order-app/android && bundle exec fastlane android beta

  fastlane:beta:
    desc: 上傳 iOS + Android Beta build（lane 會自動遞增 build number）
    cmds:
      - task: fastlane:beta:ios
      - task: fastlane:beta:android

  fastlane:production:ios:
    desc: 上傳 iOS 正式版 build、截圖與 metadata 到 App Store
    cmds:
      - cd sales-order-app/ios && bundle exec fastlane ios production

  fastlane:production:android:
    desc: 上傳 Android 正式版 build、截圖與 metadata 到 Play Store
    cmds:
      - cd sales-order-app/android && bundle exec fastlane android production

  fastlane:production:
    desc: 上傳 iOS + Android 正式版 build、截圖與 metadata（lane 會自動遞增 build number）
    cmds:
      - task: fastlane:production:ios
      - task: fastlane:production:android

  fastlane:upload_metadata:
    desc: 只上傳 iOS + Android 截圖與 metadata（等同 task app:fastlane:upload_metadata）
    cmds:
      - task: app:fastlane:upload_metadata

  build:version:
    desc: 更新 Flutter app 版本號與 build number（預設自動遞增；可傳 reset/remove/none）
    cmds:
      - task: app:build:version
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  build:number:
    desc: 只更新 Flutter build number（不改 patch version；預設 +1）
    cmds:
      - task: app:build:number

  # Screenshot orchestration (Maestro → ButterKit → export)
  screenshots:full:
    desc: 完整截圖流程：Maestro 擷取 → ButterKit 注入 → 匯出 App Store + Google Play 成品
    cmds:
      - task: app:screenshots:ios
      - task: app:screenshots:inject:ios
      - task: app:screenshots:export:ios
      - task: app:screenshots:android
      - task: app:screenshots:inject:android
      - task: app:screenshots:export:android

  screenshots:inject:all:
    desc: 將最新 iOS + Android 截圖注入 ButterKit
    cmds:
      - task: app:screenshots:inject:ios
      - task: app:screenshots:inject:android

  screenshots:export:all:
    desc: 匯出 iOS App Store + Google Play 成品
    cmds:
      - task: app:screenshots:export:ios
      - task: app:screenshots:export:android

